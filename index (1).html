  if(Math.abs(d[i])<1e-6){if(o[i]<lo||o[i]>hi)ok=false}else{let u=(lo-o[i])/d[i],v=(hi-o[i])/d[i];if(u>v)[u,v]=[v,u];t0=Math.max(t0,u);t1=Math.min(t1,v);if(t0>t1)ok=false}}
 if(ok&&t0<bd){bd=t0;best=b.id}}return best}
function loop(t){requestAnimationFrame(loop);const rd=Math.min(1,(t-lt)/1000||0),dt=Math.min(.05,rd);lt=t;
 if(!(S==='play'&&!paused&&!ins&&!apOpen))stopFootstep();
 if(S==='play'&&!paused){
  if(view&&ins){RT[rnd]=Math.max(0,RT[rnd]-rd);const s=Math.ceil(RT[rnd]);

   if(RT[rnd]<=0){timeUp();return}}
  if(!ins&&!apOpen){const lk=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),lu=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);yaw+=lk*1.8*dt;pit=Math.max(-1.2,Math.min(1.2,pit+lu*1.4*dt));
   let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0);const n=Math.hypot(mx,mz);
   if(n){const sp=2.3*dt/n,dx=(Math.cos(yaw)*mx+Math.sin(yaw)*mz)*sp,dz=(Math.sin(yaw)*mx-Math.cos(yaw)*mz)*sp;const ox=px,oz=pz;if(!blocked(px+dx,pz))px+=dx;if(!blocked(px,pz+dz))pz+=dz;const moved=Math.hypot(px-ox,pz-oz)>.001;bob=moved?Math.sin(t*.009)*.025:0;if(moved)footstep(t);else stopFootstep()}else{bob=0;stopFootstep()}
   hit=ray();xh.className=hit?'on':'';pr.style.display=hit?'block':'none';if(hit)pr.textContent='[E] Inspect '+INFO[hit].t;
   const hs='Round '+rnd+'/3 · Find the <b>'+NAMES[rnd]+'</b>'+(rnd===1?' (look near the entrance)':'')+'<br><span class="m">'+(noLock?'Arrows look · WASD move · E inspect · P pause':'WASD move · Mouse look · E inspect · Esc pause')+'</span>';
   if(hs!==hcache){hcache=hs;hn.innerHTML=hs;tm.textContent='ROUND '+rnd+'/3'}}}
 const vis=S==='title'||S==='play';cv.style.visibility=vis?'visible':'hidden';if(vis&&gl)draw(t)}
